<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natures Platter</title> 
     
    <!-- daisyui  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
     <!-- tailwind  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- google fonts  -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap');
    </style>

    <!-- custom classes  -->
    <style type="text/tailwindcss">
      @theme {
        --color-secondary: #179800;
        --color-back: #EFEBE3;
        --font-sora: "Sora", sans-serif;
      }
    </style>
</head>
<body class=" mx-auto px-4 font-sora ">
    <!-- header  -->
    <header>

        <!-- navbar -->
    <div class="navbar bg-white lg:px-18.5 ">
        <div class="navbar-start">

            <img src="c2-assets/logo-header.png" alt="natures platter logo">
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 text-sm">
            <li><a>Product</a></li>
            <li>
                <a>Services</a>
            </li>
            <li><a>Contact Us</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <div class="hidden lg:flex gap-1.5 items-center">
                <i class="fa-solid fa-magnifying-glass pr-1"></i>
                <i class="fa-solid fa-cart-shopping pr-2"></i>

                <a class="btn border border-secondary px-7.5 py-2.5 rounded-xl text-sm">Login</a>
                <a class="btn bg-secondary px-7.5 py-2.5 rounded-xl text-sm text-white" >Register</a>
            </div>

            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
                </div>
 
            </div>
        </div>
    </div>

    <!-- hero -->
    <div class="bg-linear-to-b from-white to-back flex flex-col items-center justify-center pt-11.25 gap-4 ">
        <div class="text-[28px] font-bold text-center max-w-1/2 ">
            Freshness <span class="text-secondary">You Can</span> <br> <span class="text-secondary">Count</span> On, Prices You’ll Love!
        </div>
        <div class=" text-xs text-center text-[#111111] max-w-1/2">
            Shop your daily essentials at unbeatable prices. From fresh produce to pantry staples, we’ve got you covered every day!
        </div>
        <div class="  border-amber-600 bg-[url(c2-assets/hero-vegetables.png)] bg-center bg-cover bg-no-repeat lg:w-10/16" >
            <img src="c2-assets/hero-vegetables.png" alt="hero-image" class="invisible">
        </div>

    </div>
    </header>   

     
   
</body>
</html>
